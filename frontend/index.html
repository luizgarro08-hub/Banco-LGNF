<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LGNF</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <div class="user-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div>
                    <span class="greeting">Olá,</span>
                    <h3 id="user-name">Carregando...</h3>
                </div>
            </div>
            <button class="btn-icon" id="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <div class="balance-card">
            <div class="balance-header">
                <span>Saldo disponível</span>
                <i class="fa-regular fa-eye" id="toggle-balance" style="cursor: pointer;"></i>
            </div>
            <div class="balance-amount">
                <span class="currency">R$</span>
                <h1 id="account-balance">0,00</h1>
            </div>
        </div>

        <div class="quick-actions">
            <div class="action-btn" onclick="abrirPix()">
                <div class="icon-circle"><i class="fa-solid fa-pix"></i></div>
                <span>Pix</span>
            </div>
            <div class="action-btn" onclick="abrirPagar()">
                <div class="icon-circle"><i class="fa-solid fa-barcode"></i></div>
                <span>Pagar</span>
            </div>
            <div class="action-btn" onclick="abrirTransferir()">
                <div class="icon-circle"><i class="fa-solid fa-paper-plane"></i></div>
                <span>Transferir</span>
            </div>
            <div class="action-btn" onclick="abrirExtrato()">
                <div class="icon-circle"><i class="fa-solid fa-receipt"></i></div>
                <span>Extrato</span>
            </div>
        </div>

        <div class="card-section">
            <div class="card-header">
                <i class="fa-regular fa-credit-card"></i>
                <span>Meus cartões</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="history-section">
            <h3>Histórico de Atividades</h3>
            <div class="history-list" id="transaction-history">
                </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
