<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LGNF</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <div class="user-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div>
                    <span class="greeting">Olá,</span>
                    <h3 id="user-name">Luiz Garro</h3>
                </div>
            </div>
            <button class="btn-icon" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <div class="balance-card">
            <div class="balance-header">
                <span>Saldo disponível</span>
                <i class="fa-regular fa-eye" id="toggle-balance"></i>
            </div>
            <div class="balance-amount">
                <span class="currency">R$</span>
                <h1 id="account-balance">1.250,00</h1>
            </div>
        </div>

        <div class="quick-actions">
            <div class="action-btn">
                <div class="icon-circle"><i class="fa-solid fa-pix"></i></div>
                <span>Pix</span>
            </div>
            <div class="action-btn">
                <div class="icon-circle"><i class="fa-solid fa-barcode"></i></div>
                <span>Pagar</span>
            </div>
            <div class="action-btn">
                <div class="icon-circle"><i class="fa-solid fa-paper-plane"></i></div>
                <span>Transferir</span>
            </div>
            <div class="action-btn">
                <div class="icon-circle"><i class="fa-solid fa-receipt"></i></div>
                <span>Extrato</span>
            </div>
        </div>

        <div class="card-section">
            <div class="card-header">
                <i class="fa-regular fa-credit-card"></i>
                <span>Meus cartões</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="history-section">
            <h3>Histórico de Atividades</h3>
            <div class="history-list" id="transaction-history">
                <div class="history-item">
                    <div class="history-icon green"><i class="fa-solid fa-arrow-down"></i></div>
                    <div class="history-details">
                        <strong>Pix Recebido</strong>
                        <span>Hoje, 14:20</span>
                    </div>
                    <span class="history-amount positive">+ R$ 150,00</span>
                </div>
                <div class="history-item">
                    <div class="history-icon red"><i class="fa-solid fa-arrow-up"></i></div>
                    <div class="history-details">
                        <strong>Pagamento de Boleto</strong>
                        <span>Ontem, 09:15</span>
                    </div>
                    <span class="history-amount negative">- R$ 85,90</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
